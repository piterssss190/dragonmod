# Minecraft 26.2 "Chaos Cubed" (wydany 16.06.2026).
# WAŻNE: od wersji 26.1 Fabric NIE UŻYWA już Yarn mappings - Minecraft jest
# dystrybuowany nieobfuskowany, z oficjalnymi nazwami Mojang, więc brak tu
# wpisu yarn_mappings (celowo). Loom 1.15+ nie remapuje już kodu.
# Numer wersji samego pluginu Loom jest wpisany na sztywno w build.gradle
# (blok plugins{} nie pozwala na zmienne), więc nie ma go tutaj.
# Sprawdź zawsze aktualne numery na https://fabricmc.net/develop (mogły
# wyjść nowsze buildy patch/hotfix niż te wpisane poniżej).
minecraft_version=26.2
loader_version=0.18.4
fabric_version=0.158.0+26.2
# Przypięta konkretna wersja Loom (nie "-SNAPSHOT" - pływająca wersja
# rozwiązywała się niedeterministycznie do różnych, niespójnie zachowujących
# się buildów). Odczytywana w build.gradle jako "${loom_version}" bez
# prefiksu "project." - to jedyny sposób podstawienia zmiennej w bloku
# plugins{}, potwierdzony w oficjalnym FabricMC/fabric-example-mod.
loom_version=1.17.20

mod_version=1.0.0
maven_group=com.dragonmod
archives_base_name=dragonmod
