pluginManagement {
    repositories {
        // Fabric Loom (zwłaszcza wersje -SNAPSHOT) jest publikowany we własnym
        // repozytorium Maven Fabric, a nie tylko w Gradle Plugin Portal.
        // Bez tego wpisu Gradle nie znajdzie pluginu 'fabric-loom'.
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'dragonmod'
