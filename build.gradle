plugins {
    // UWAGA KLUCZOWA: pełny identyfikator pluginu 'net.fabricmc.fabric-loom'
    // (NIE skrócony alias 'fabric-loom'!) - to prawdziwy identyfikator używany
    // w oficjalnym FabricMC/fabric-example-mod na gałęzi 26.1. Skrócony alias
    // w Gradle Plugin Portal wskazywał najwidoczniej na starszy, remapujący
    // wariant pluginu, który wewnętrznie zawsze oczekuje czegoś w konfiguracji
    // 'mappings' - stąd uporczywy błąd "Configuration 'mappings' has no
    // dependencies" mimo poprawnego (braku) bloku mappings w dependencies{}.
    //
    // UWAGA: blok plugins{} normalnie NIE pozwala na podstawianie zmiennych,
    // ALE odczyt property bezpośrednio z gradle.properties (bez prefiksu
    // "project.") jest tu wyjątkiem dopuszczonym przez Gradle - to dokładnie
    // wzorzec użyty w oficjalnym przykładzie Fabric.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Rejestracja moda w systemie Loom - część oficjalnego wzorca dla wersji
// nieobfuskowanych (26.1+). Nie używamy pełnego splitEnvironmentSourceSets()
// (rozdzielenie main/client na osobne katalogi źródłowe), ponieważ nasz kod
// trzyma podział server/client przez pakiety (com.dragonmod vs
// com.dragonmod.client) w jednym sourceSet "main" - prościej, kosztem
// mniej rygorystycznego wymuszenia granicy server/client przez sam Gradle.
loom {
    mods {
        "dragonmod" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Dodaj tu dodatkowe repozytoria, jeśli korzystasz np. z GeckoLib
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // POTWIERDZONE oficjalnym ogłoszeniem Fabric dla 26.1 (fabricmc.net/2026/03/14/261.html):
    // "As mappings are not provided for 26.1..." - dla wersji nieobfuskowanych (26.1+)
    // NIE deklaruje się bloku 'mappings' w ogóle. loom.officialMojangMappings() służy
    // do pobierania map deobfuskacji dla STARSZYCH, obfuskowanych wersji (<=1.21.11)
    // i celowo zawiedzie dla 26.2, bo taka mapa nie istnieje (nie ma czego mapować).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    withSourcesJar()
    // POTWIERDZONE przez realny build (Fabric Loom sam to zweryfikował przy
    // konfigurowaniu Minecrafta 26.2): gra wymaga Java 25, nie 21.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
