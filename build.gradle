plugins {
    // UWAGA: blok plugins{} w Gradle NIE pozwala na podstawianie zmiennych
    // (np. "${project.loom_version}") - wymaga dosłownego literału String.
    // PRZYPIĘTA KONKRETNA WERSJA (nie "-SNAPSHOT"): pływający "1.15-SNAPSHOT"
    // rozwiązywał się niedeterministycznie do różnych konkretnych buildów
    // (raz 1.15.5, raz 1.17.20) o różnym zachowaniu wobec nieobfuskowanego
    // 26.2 (starszy build błędnie wymagał bloku 'mappings', nowszy - nie).
    // 1.17.20 to potwierdzony, realnie istniejący build z poprawną obsługą.
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Dodaj tu dodatkowe repozytoria, jeśli korzystasz np. z GeckoLib
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // POTWIERDZONE oficjalnym ogłoszeniem Fabric dla 26.1 (fabricmc.net/2026/03/14/261.html):
    // "As mappings are not provided for 26.1..." - dla wersji nieobfuskowanych (26.1+)
    // NIE deklaruje się bloku 'mappings' w ogóle. loom.officialMojangMappings() służy
    // do pobierania map deobfuskacji dla STARSZYCH, obfuskowanych wersji (<=1.21.11)
    // i celowo zawiedzie dla 26.2, bo taka mapa nie istnieje (nie ma czego mapować).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    withSourcesJar()
    // POTWIERDZONE przez realny build (Fabric Loom sam to zweryfikował przy
    // konfigurowaniu Minecrafta 26.2): gra wymaga Java 25, nie 21.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
